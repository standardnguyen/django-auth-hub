version: '3.8'

services:
  web:
    build: 
      context: ..
      dockerfile: docker/Dockerfile
    restart: always
    env_file:
      - ../.env
    volumes:
      - ../staticfiles:/app/staticfiles
    depends_on:
      - db
    networks:
      - auth_network

  db:
    image: postgres:17-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - ../.env
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    networks:
      - auth_network

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../staticfiles:/usr/share/nginx/html/static
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ${SSL_CERT_PATH:-./certs/localhost.crt}:/etc/nginx/ssl/cert.crt
      - ${SSL_KEY_PATH:-./certs/localhost.key}:/etc/nginx/ssl/cert.key
    depends_on:
      - web
    networks:
      - auth_network

networks:
  auth_network:
    driver: bridge

volumes:
  postgres_data: